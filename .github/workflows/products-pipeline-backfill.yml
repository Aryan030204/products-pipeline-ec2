name: Products Pipeline – rolling backfill

# Runs the product sessions pipeline as a one-shot backfill that refetches each
# brand's last N brand-local days (default 2), then exits.
#
# Schedule: 12:10 IST == 06:40 UTC. GitHub cron is UTC-only, and "*/2" on the
# day-of-month runs on days 1,3,5,…,31 then 1 — the standard "every 2 days"
# approximation (a 1-day gap straddles each month boundary).
#
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   GET_BRANDS_API, PIPELINE_AUTH_HEADER, PASSWORD_AES_KEY
# Optional repo variables (same page, "Variables" tab):
#   DB_SSL_ENABLED, SHOPIFYQL_TIMEZONE, BACKFILL_BRAND_CONCURRENCY,
#   HOURLY_PRODUCT_SESSIONS_ENABLED, HOURLY_PRODUCT_SESSIONS_BACKFILL_ENABLED

on:
  schedule:
    - cron: "40 6 */2 * *" # 12:10 IST (06:40 UTC), every 2nd day-of-month
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Most-recent brand-local days to refetch (per brand)"
        required: false
        default: "2"

# Never let two backfills overlap; let a running one finish rather than cancel it.
concurrency:
  group: products-pipeline-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run rolling backfill
        env:
          # Backfill control — the pipeline computes each brand's window in its
          # own timezone, so the workflow does no date math.
          BACKFILL_MODE: "true"
          BACKFILL_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '2' }}
          EXIT_AFTER_BACKFILL: "true"
          SELF_RUN: "false"

          # Credentials (required).
          GET_BRANDS_API: ${{ secrets.GET_BRANDS_API }}
          PIPELINE_AUTH_HEADER: ${{ secrets.PIPELINE_AUTH_HEADER }}
          PASSWORD_AES_KEY: ${{ secrets.PASSWORD_AES_KEY }}

          # Operational knobs (optional; fall back to sensible defaults).
          BACKFILL_BRAND_CONCURRENCY: ${{ vars.BACKFILL_BRAND_CONCURRENCY || '3' }}
          SHOPIFYQL_TIMEZONE: ${{ vars.SHOPIFYQL_TIMEZONE || 'Asia/Kolkata' }}
          HOURLY_PRODUCT_SESSIONS_ENABLED: ${{ vars.HOURLY_PRODUCT_SESSIONS_ENABLED || 'true' }}
          HOURLY_PRODUCT_SESSIONS_BACKFILL_ENABLED: ${{ vars.HOURLY_PRODUCT_SESSIONS_BACKFILL_ENABLED || 'false' }}
          # Set the repo variable DB_SSL_ENABLED=true if a brand DB host isn't an
          # *.amazonaws.com endpoint (auto-TLS only triggers for those).
          DB_SSL_ENABLED: ${{ vars.DB_SSL_ENABLED }}
        run: node pipeline.js
